<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
<title>选择登录站点</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #07090c; color: #e7ece3;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column;
    padding: 32px 36px 24px; user-select: none;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: .2px; }
  .sub { margin: 8px 0 24px; color: #8b9588; font-size: 13px; line-height: 1.6; }
  .options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; flex: 1; }
  .option {
    position: relative; display: flex; flex-direction: column; gap: 10px;
    padding: 18px; border-radius: 16px; text-align: left; cursor: pointer;
    background: #0d1016; color: inherit; border: 1px solid rgba(255,255,255,.09);
    transition: border-color .16s ease, background .16s ease, transform .16s ease;
  }
  .option:hover { border-color: rgba(183,243,74,.55); background: #111610; transform: translateY(-1px); }
  .option.current { border-color: #b7f34a; box-shadow: 0 0 0 1px rgba(183,243,74,.25) inset; }
  .option:disabled { opacity: .55; cursor: wait; }
  .badge {
    align-self: flex-start; padding: 3px 8px; border-radius: 999px;
    font-size: 10px; font-weight: 700; letter-spacing: .06em;
    background: rgba(183,243,74,.12); color: #b7f34a; border: 1px solid rgba(183,243,74,.3);
  }
  .badge.muted { background: rgba(255,255,255,.05); color: #9aa396; border-color: rgba(255,255,255,.1); }
  h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .host { color: #b7f34a; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .desc { margin: 0; color: #8b9588; font-size: 12px; line-height: 1.55; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 20px; }
  .hint { color: #6f786d; font-size: 11px; line-height: 1.5; }
  .actions { display: flex; gap: 10px; }
  button.action {
    padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 600;
    border: 1px solid rgba(255,255,255,.12); background: transparent; color: #c6cec2; cursor: pointer;
  }
  button.action:hover { background: rgba(255,255,255,.06); }
  button.primary { background: #b7f34a; border-color: #b7f34a; color: #141b07; }
  button.primary:hover { background: #c6f764; }
  .status { min-height: 18px; margin-top: 10px; color: #f0a26b; font-size: 12px; }
</style>
</head>
<body>
  <h1>选择登录站点</h1>
  <p class="sub">桌面端会加载所选站点的登录页，登录账号与业务数据都归属该站点。选择“本地模式”则使用本机数据库，离线可用，账号也独立保存在本机。</p>

  <div class="options">
    <button class="option" data-mode="cloud" data-url="https://ai.ai2dot.com">
      <span class="badge muted">线上</span>
      <h2>ai.ai2dot.com</h2>
      <span class="host">ai.ai2dot.com</span>
      <p class="desc">线上 Web 部署，账号、会话与知识库都在云端，需要联网。</p>
    </button>

    <button class="option" data-mode="cloud" data-url="https://dot.ai2dot.com">
      <span class="badge">本地 Docker</span>
      <h2>dot.ai2dot.com</h2>
      <span class="host">dot.ai2dot.com</span>
      <p class="desc">连接本地 Docker 部署，账号与数据跟随该站点；启动前请确认服务可访问。</p>
    </button>

    <button class="option" data-mode="local" data-url="">
      <span class="badge muted">离线</span>
      <h2>本地模式</h2>
      <span class="host">PGlite · 本机</span>
      <p class="desc">完全使用本机资源与数据库，不依赖网络；账号为本机独立账号。</p>
    </button>
  </div>

  <div class="status" id="status"></div>

  <div class="foot">
    <span class="hint">选择后会重启应用。之后可在菜单「账号 → 切换登录站点…」再次修改。</span>
    <div class="actions">
      <button class="action" id="cancel">取消</button>
    </div>
  </div>

  <script>
    const status = document.getElementById("status");
    let current = null;
    let busy = false;

    function sameSite(option) {
      if (!current) return false;
      if (option.dataset.mode === "local") return current.mode === "local";
      return current.mode === "cloud" &&
        option.dataset.url === current.serverUrl.replace(/\/+$/, "");
    }

    function markCurrent() {
      for (const option of document.querySelectorAll(".option")) {
        option.classList.toggle("current", sameSite(option));
      }
    }

    async function choose(option) {
      if (busy) return;
      busy = true;
      status.textContent = "正在保存并重启…";
      for (const item of document.querySelectorAll(".option")) item.disabled = true;
      try {
        const result = await window.sitePicker.choose({
          mode: option.dataset.mode,
          serverUrl: option.dataset.url,
        });
        if (!result?.ok) {
          status.textContent = result?.error || "保存失败，请重试。";
          busy = false;
          for (const item of document.querySelectorAll(".option")) item.disabled = false;
        }
      } catch (error) {
        status.textContent = String(error?.message || error);
        busy = false;
        for (const item of document.querySelectorAll(".option")) item.disabled = false;
      }
    }

    for (const option of document.querySelectorAll(".option")) {
      option.addEventListener("click", () => choose(option));
    }
    document.getElementById("cancel").addEventListener("click", () => window.sitePicker.cancel());

    window.sitePicker.current().then((value) => {
      current = value;
      if (current?.serverUrl) current.serverUrl = current.serverUrl.replace(/\/+$/, "");
      markCurrent();
    }).catch(() => {});
  </script>
</body>
</html>
